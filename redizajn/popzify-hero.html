<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Bez ovog taga telefon koristi layout viewport od 980px, pa media query
     max-width:640px nikad ne okine: HUD meta i hint su ostajali na ekranu,
     a tekst je bio sitan. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Popzify Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  /* Layout: full-bleed WebGL stage framed like a camera viewfinder; HUD text sits in the four corners. Single dark look by choice. */
  :root {
    --void: #07060d;
    --ink: #ecebff;
    --muted: #8d8bb3;
    --violet: #6366f1;
    --rec: #ff3b5c;
    --frame: rgba(236, 235, 255, .55);
    --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
    --f-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--void); color: var(--ink); font-family: var(--f-body); overflow: hidden; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .hud { position: fixed; inset: 0; pointer-events: none; padding: clamp(16px, 3.2vw, 40px);
         padding-top: calc(clamp(16px, 3.2vw, 40px) + env(safe-area-inset-top, 0px));
         padding-bottom: calc(clamp(16px, 3.2vw, 40px) + env(safe-area-inset-bottom, 0px));
         display: grid; grid-template-rows: auto 1fr auto; }
  .corner { position: absolute; width: clamp(18px, 3vw, 34px); height: clamp(18px, 3vw, 34px); border-color: var(--frame); border-style: solid; border-width: 0; }
  .c-tl { top: clamp(8px, 1.6vw, 20px); left: clamp(8px, 1.6vw, 20px); border-top-width: 1.5px; border-left-width: 1.5px; }
  .c-tr { top: clamp(8px, 1.6vw, 20px); right: clamp(8px, 1.6vw, 20px); border-top-width: 1.5px; border-right-width: 1.5px; }
  .c-bl { bottom: clamp(8px, 1.6vw, 20px); left: clamp(8px, 1.6vw, 20px); border-bottom-width: 1.5px; border-left-width: 1.5px; }
  .c-br { bottom: clamp(8px, 1.6vw, 20px); right: clamp(8px, 1.6vw, 20px); border-bottom-width: 1.5px; border-right-width: 1.5px; }

  .top, .bottom { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .bottom { align-items: flex-end; }
  .brand { font-family: var(--f-display); font-weight: 700; font-size: clamp(16px, 1.6vw, 20px); letter-spacing: .02em; }
  .brand b { color: var(--violet); font-weight: 700; }
  .mono { font-family: var(--f-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; }
  .rec { display: flex; align-items: center; gap: 10px; color: var(--ink); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--rec); box-shadow: 0 0 12px var(--rec); animation: blink 1.2s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .15; } }

  .headline { max-width: 34ch; display: grid; gap: 14px; }
  h1 { margin: 0; font-family: var(--f-display); font-weight: 500; font-size: clamp(26px, 4.4vw, 58px); line-height: 1.02; letter-spacing: -.02em; text-wrap: balance; }
  h1 em { font-style: normal; color: transparent; -webkit-text-stroke: 1px var(--ink); }
  .sub { margin: 0; color: var(--muted); font-size: clamp(14px, 1.15vw, 16px); line-height: 1.55; max-width: 44ch; }
  .meta { display: grid; gap: 6px; text-align: right; }
  .hint { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(clamp(16px, 3.2vw, 40px) + env(safe-area-inset-bottom, 0px)); }

  @media (max-width: 640px) {
    .meta { display: none; }
    .hint { display: none; }
    .headline { max-width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
</style>
</head>
<body>

<canvas id="stage" aria-label="Rotating 3D Popzify logo made of glass, with a chrome ring and drifting light particles"></canvas>

<div class="hud">
  <span class="corner c-tl"></span><span class="corner c-tr"></span>
  <span class="corner c-bl"></span><span class="corner c-br"></span>

  <div class="top">
    <div class="brand"><b>Pop</b>zify</div>
    <div class="rec mono"><span class="dot"></span><span>REC</span><span id="tc">00:00:00:00</span></div>
  </div>

  <div></div>

  <div class="bottom">
    <div class="headline">
      <h1>We make brands <em>pop</em> on screen.</h1>
      <p class="sub">Video production, drone cinematography, editing and social design from Belgrade.</p>
    </div>
    <div class="meta mono">
      <span>4K · 24 FPS · 180°</span>
      <span>ISO 800 · ƒ/2.8</span>
      <span>44.8436° N · 20.4123° E</span>
    </div>
  </div>
  <div class="hint mono">Move to direct the shot</div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const mobile = matchMedia('(max-width: 640px)').matches;
const canvas = document.getElementById('stage');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, mobile ? 1.5 : 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07060d);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);

// coloured key lights for the glass to catch
const l1 = new THREE.PointLight(0x8b5cf6, 60, 20); l1.position.set(-4, 3, 4); scene.add(l1);
const l2 = new THREE.PointLight(0x22d3ee, 40, 20); l2.position.set(4, -3, 3); scene.add(l2);

// a soft violet backdrop disc so the transmission has something to bend
const back = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `varying vec2 vUv; uniform float uT;
    void main(){ vec2 p=vUv-.5; float d=length(p*vec2(1.,1.1));
      float g=smoothstep(.22,0.,d)*.55 + smoothstep(.09,0.,abs(d-.12-sin(uT*.4)*.01))*.08;
      vec3 c=mix(vec3(.39,.40,.95), vec3(.66,.33,.97), smoothstep(-.2,.2,p.x+p.y));
      gl_FragColor=vec4(c*g, g); }`,
  uniforms: { uT: { value: 0 } }
}));
back.position.z = -4; scene.add(back);

const hero = new THREE.Group(); scene.add(hero);

// ---- P with play-triangle counter, from the SVG mark (y flipped) ----
const s = new THREE.Shape();
s.moveTo(190, -136); s.lineTo(276, -136);
s.absarc(276, -224, 88, Math.PI / 2, -Math.PI / 2, true);
s.lineTo(246, -312); s.lineTo(246, -370);
s.quadraticCurveTo(246, -380, 236, -380); s.lineTo(190, -380);
s.quadraticCurveTo(180, -380, 180, -370); s.lineTo(180, -146);
s.quadraticCurveTo(180, -136, 190, -136);
const tri = new THREE.Path(); tri.moveTo(248, -186); tri.lineTo(312, -224); tri.lineTo(248, -262); tri.lineTo(248, -186);
s.holes.push(tri);

const pGeo = new THREE.ExtrudeGeometry(s, { depth: 44, bevelEnabled: true, bevelThickness: 12, bevelSize: 7, bevelSegments: 10, curveSegments: 64 });
pGeo.center(); pGeo.scale(0.0105, 0.0105, 0.0105);
const glass = new THREE.MeshPhysicalMaterial({
  color: 0xa5a6ff, metalness: 0, roughness: 0.06, transmission: 1, thickness: 1.4, ior: 1.45,
  iridescence: 1, iridescenceIOR: 1.35, iridescenceThicknessRange: [120, 480],
  clearcoat: 1, clearcoatRoughness: 0.05, attenuationColor: new THREE.Color(0x6366f1), attenuationDistance: 1.1,
  envMapIntensity: 1.6, specularIntensity: 1
});
const P = new THREE.Mesh(pGeo, glass);
P.position.x = -0.06;
hero.add(P);

// ---- chrome ring ----
const ringMat = new THREE.MeshPhysicalMaterial({ color: 0xe4e2ff, metalness: 1, roughness: 0.14, iridescence: 0.8, iridescenceIOR: 1.6, clearcoat: 1, envMapIntensity: 2.2 });
const ring = new THREE.Mesh(new THREE.TorusGeometry(2.24, 0.055, 48, 320), ringMat);
hero.add(ring);
const ring2 = new THREE.Mesh(new THREE.TorusGeometry(2.42, 0.008, 12, 320), new THREE.MeshBasicMaterial({ color: 0x8b8cff, transparent: true, opacity: .35 }));
hero.add(ring2);

// ---- particles ----
const N = mobile ? 900 : 2200;
const pos = new Float32Array(N * 3), seed = new Float32Array(N), col = new Float32Array(N * 3);
const palette = [new THREE.Color(0xb9a6ff), new THREE.Color(0xffffff), new THREE.Color(0x8b8cff), new THREE.Color(0x67e8f9), new THREE.Color(0xd8b4fe)];
for (let i = 0; i < N; i++) {
  const side = Math.random() < .5 ? -1 : 1;
  const r = 2.4 + Math.pow(Math.random(), .7) * 4.5;
  const a = Math.random() * Math.PI * 2;
  pos[i*3] = Math.cos(a) * r * (Math.random() < .65 ? 1 : .55) + side * Math.random() * .6;
  pos[i*3+1] = (Math.random() - .5) * 9;
  pos[i*3+2] = (Math.random() - .5) * 5 - .5;
  seed[i] = Math.random();
  const c = palette[(Math.random() * palette.length) | 0]; col.set([c.r, c.g, c.b], i * 3);
}
const ptsGeo = new THREE.BufferGeometry();
ptsGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
ptsGeo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
ptsGeo.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
const ptsMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { uT: { value: 0 }, uPR: { value: renderer.getPixelRatio() }, uMouse: { value: new THREE.Vector2() } },
  vertexShader: `attribute float aSeed; attribute vec3 aColor; uniform float uT, uPR; uniform vec2 uMouse;
    varying vec3 vC; varying float vA;
    void main(){ vec3 p=position;
      p.y = mod(p.y + uT*(.12+aSeed*.25) + 4.5, 9.) - 4.5;
      p.x += sin(uT*.6 + aSeed*30.)*.12; p.xy += uMouse*(.25+aSeed*.5);
      vec4 mv = modelViewMatrix*vec4(p,1.);
      float big = step(.985, aSeed);
      gl_PointSize = (mix(2.5, 9., aSeed*aSeed) + big*14.) * uPR * (6./-mv.z);
      vA = (.35 + .65*abs(sin(uT*(.6+aSeed*2.) + aSeed*40.))) * smoothstep(4.5, 3., abs(p.y));
      vC = aColor; gl_Position = projectionMatrix*mv; }`,
  fragmentShader: `varying vec3 vC; varying float vA;
    void main(){ vec2 c=gl_PointCoord-.5; float d=length(c);
      float disc = smoothstep(.5,.38,d); float core = smoothstep(.22,0.,d);
      float a = (disc*.55 + core*.8) * vA; if(a<.01) discard;
      gl_FragColor = vec4(vC*(.8+core), a); }`
});
const points = new THREE.Points(ptsGeo, ptsMat); scene.add(points);

// ---- light streaks ----
const streaks = new THREE.Group(); streaks.rotation.z = -0.62; scene.add(streaks);
const streakMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  uniforms: { uT: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `varying vec2 vUv; void main(){
      float head = pow(vUv.y, 6.); float edge = smoothstep(.5,0.,abs(vUv.x-.5));
      vec3 c = mix(vec3(.75,.55,1.), vec3(1.,.92,.85), head);
      gl_FragColor = vec4(c, (head*1.2 + vUv.y*.25) * edge); }`
});
const SN = mobile ? 6 : 12, streakData = [];
for (let i = 0; i < SN; i++) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(0.018 + Math.random() * .02, 1.8 + Math.random() * 2.2), streakMat);
  streakData.push({ m, x: 1.2 + Math.random() * 1.6, y: Math.random() * 14 - 7, v: 1.4 + Math.random() * 2.2, z: Math.random() * 1.5 - .3 });
  streaks.add(m);
}

// ---- post ----
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.75, 0.55, 0.2);
composer.addPass(bloom);
composer.addPass(new OutputPass());

function resize() {
  const w = innerWidth, h = innerHeight, asp = w / h;
  renderer.setSize(w, h, false); composer.setSize(w, h); bloom.setSize(w, h);
  camera.aspect = asp; camera.position.z = asp < 1 ? 10.5 / Math.max(asp, .5) : 10.5;
  hero.position.y = asp < 1 ? .9 : .25;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// ---- pointer ----
const target = new THREE.Vector2(), cur = new THREE.Vector2();
addEventListener('pointermove', e => { target.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight * 2 - 1)); });

// ---- timecode (24 fps) ----
const tc = document.getElementById('tc'); const pad = n => String(n).padStart(2, '0');

const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime * (reduce ? .25 : 1);
  cur.lerp(target, .05);

  const intro = 1 - Math.pow(1 - Math.min(clock.elapsedTime / 2.2, 1), 3);
  hero.scale.setScalar(.72 + .28 * intro);
  hero.rotation.y = cur.x * .45 + Math.sin(t * .35) * .22 + (1 - intro) * -1.2;
  hero.rotation.x = -cur.y * .3 + Math.sin(t * .27) * .06;
  ring.rotation.x = Math.sin(t * .5) * .12 + (1 - intro) * 1.4;
  ring.rotation.y = Math.cos(t * .4) * .1;
  ring2.rotation.set(Math.sin(t * .3) * .3, Math.cos(t * .25) * .3, t * .1);
  P.position.y = Math.sin(t * .8) * .05;

  ptsMat.uniforms.uT.value = t; ptsMat.uniforms.uMouse.value.copy(cur);
  back.material.uniforms.uT.value = t;
  for (const d of streakData) {
    d.y += d.v * dt * (reduce ? .25 : 1);
    if (d.y > 7) { d.y = -7; d.x = 1.2 + Math.random() * 1.6; }
    d.m.position.set(d.x + cur.x * .3, d.y, d.z);
  }

  const f = Math.floor(clock.elapsedTime * 24);
  tc.textContent = `${pad(Math.floor(f / 86400))}:${pad(Math.floor(f / 1440) % 60)}:${pad(Math.floor(f / 24) % 60)}:${pad(f % 24)}`;

  composer.render();
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
